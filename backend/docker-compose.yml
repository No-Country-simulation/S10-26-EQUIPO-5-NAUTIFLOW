
services:
  postgres:
    image: postgres:16-alpine
    container_name: delta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: delta_db
      POSTGRES_USER: delta_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5433"
    volumes:
      - delta_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delta_user -d delta_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  delta_postgres_data:
